<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymesh Portal</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Cookiebot CMP Banner - loaded dynamically via JavaScript -->
  </head>

  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Start of polymesh Zendesk Widget script -->
    <script>
      // Injected once `load` has fired rather than sitting in the markup. Any
      // script present at parse time holds the load event open — `async` and
      // `defer` included — and the wallet extension handshake waits on it:
      // `enableWeb3Extension` wraps its connect call in `documentReadyPromise`
      // (@polkadot/extension-dapp), which resolves on `load`. Loading the widget
      // inline meant a slow or unreachable widget host stalled wallet
      // connection for as long as the request took to settle.
      (function () {
        function injectZendesk() {
          var s = document.createElement('script');
          s.id = 'ze-snippet';
          s.async = true;
          s.src =
            'https://static.zdassets.com/ekr/snippet.js?key=b94f5af7-f184-498f-a49d-168c658027be';
          document.body.appendChild(s);
        }

        if (document.readyState === 'complete') {
          injectZendesk();
        } else {
          window.addEventListener('load', injectZendesk);
        }
      })();
    </script>
    <!-- End of polymesh Zendesk Widget script -->
  </body>
</html>
